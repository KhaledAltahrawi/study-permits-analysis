name: Monthly IRCC Data Sync

on:
  schedule:
    # Runs at 06:00 UTC on the 5th of every month (following monthly IRCC releases)
    - cron: '0 6 5 * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force pipeline execution even if checksum matches'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync-data:
    name: Check & Sync IRCC Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl matplotlib numpy

      - name: Ingest & Validate IRCC Dataset
        id: sync
        run: |
          ARG=""
          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            ARG="--force"
          fi
          python scripts/fetch_data.py $ARG

      - name: Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ images/ study_permits_by_country_2015_2026.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): sync latest IRCC release and refresh figures [skip ci]"
            git push origin master
          else
            echo "No data changes detected. Repository is already up to date."
          fi
